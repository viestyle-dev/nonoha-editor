name: test

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build IIFEs
        run: npm run build:iife

      - name: Keep the IIFEs apart (views get their clients from the host)
        run: |
          if grep -qE "GraphClient|InspectorClient" packages/nonoha-views/dist/nonoha-views.iife.js; then
            echo "nonoha-views.iife.js bundles client code"; exit 1
          fi
          if grep -qE "createViewHost|defineView" packages/nonoha-client-js/dist/nonoha-client.iife.js; then
            echo "nonoha-client.iife.js bundles view code"; exit 1
          fi
